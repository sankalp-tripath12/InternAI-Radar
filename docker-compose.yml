services:
  postgres:
    image: postgres:16-alpine
    container_name: internai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: internai
      POSTGRES_PASSWORD: internai_dev_password
      POSTGRES_DB: internai_radar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internai -d internai_radar"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: internai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
